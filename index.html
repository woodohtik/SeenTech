<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Tajawal/IBM Plex Sans Arabic are hosted locally (public/fonts/,
         src/index.css @font-face) -- seen-design-system-v5.1-task.md item 1.
         seen-performance-first-open-login-task.md Phase 1: the Google Fonts
         stylesheet (Noto Nastaliq Urdu + Noto Naskh Arabic + Inter, 15
         weights) used to sit here and block the first paint for every
         visitor, while the Arabic UI never uses those families. It is now
         injected only when the language is Urdu or English
         (src/lib/direction.ts ensureLanguageFonts). -->
    <link rel="preload" href="/fonts/IBMPlexSansArabic-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- seen-search-appearance-task.md: /favicon.ico first (where Bing and older
         browsers look), the SVG for modern browsers, a 96px PNG for Google, the
         touch icon for iOS. ?v=2 gets past icons browsers kept from the old logo. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png?v=2" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0E2A42" />
    <title>سين | نظام إدارة محلات تفصيل الثياب</title>
    <!-- One description for every search engine, read before any JavaScript
         runs (Bing mostly does not run it). -->
    <meta name="description" content="سين نظام لإدارة محلات تفصيل الثياب: طلبات التفصيل والمقاسات ونقطة البيع والفواتير الإلكترونية المربوطة مع زاتكا." />
    <link rel="canonical" href="https://www.seentech.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="سين" />
    <meta property="og:title" content="سين | نظام إدارة محلات تفصيل الثياب" />
    <meta property="og:description" content="سين نظام لإدارة محلات تفصيل الثياب: طلبات التفصيل والمقاسات ونقطة البيع والفواتير الإلكترونية المربوطة مع زاتكا." />
    <meta property="og:url" content="https://www.seentech.io/" />
    <meta property="og:image" content="https://www.seentech.io/icon-512.png" />
    <meta property="og:locale" content="ar_SA" />
    <meta name="twitter:card" content="summary" />
    <!-- The splash inside #root below: painted from the first bytes of the
         page, replaced by React's first render. Plain CSS, no web font. -->
    <style>
      #seen-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#EBEDEF;color:#0F6E96;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
      #seen-splash .mark{width:72px;height:72px;border-radius:20px;background:#0F6E96;display:flex;align-items:center;justify-content:center}
      #seen-splash .name{font-size:22px;font-weight:700;color:#0E2A42}
      #seen-splash .bar{width:120px;height:4px;border-radius:4px;background:rgba(15,110,150,.15);overflow:hidden}
      #seen-splash .bar i{display:block;width:40%;height:100%;border-radius:4px;background:#0F6E96;animation:seen-splash 1.1s ease-in-out infinite}
      @keyframes seen-splash{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
      @media (prefers-reduced-motion:reduce){#seen-splash .bar i{animation:none;width:100%;opacity:.4}}
      html.dark #seen-splash{background:#0F172A}
      html.dark #seen-splash .name{color:#F8FAFC}
      .seen-static-desc{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
    <script>
      // next-themes keeps the choice under "theme"; match the splash to it.
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen overflow-x-hidden antialiased flex flex-col w-full">
    <div id="root"><div id="seen-splash" role="status" aria-label="جاري تحميل نظام سين"><div class="mark"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 25c4 5 10 6 15 3 4-2 6-6 5-10-1-3-4-5-7-4-3 1-4 4-3 7 1 4 6 6 10 4 3-1 5-4 6-7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="name">سِين</div><div class="bar"><i></i></div></div><p class="seen-static-desc"><strong>سين</strong> سين نظام لإدارة محلات تفصيل الثياب: طلبات التفصيل والمقاسات ونقطة البيع والفواتير الإلكترونية المربوطة مع زاتكا.</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

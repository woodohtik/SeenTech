<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Tajawal/IBM Plex Sans Arabic now hosted locally (public/fonts/,
         src/index.css @font-face) instead of Google Fonts -- seen-design-
         system-v5.1-task.md item 1: a cashier screen that may run
         partially offline shouldn't depend on a Google Fonts round-trip
         for its core Arabic typeface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Urdu needs Nastaliq/Naskh coverage (no local file for it); Latin UI uses Inter. Both stay on Google Fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/Logo.svg" />
    <meta name="theme-color" content="#1F3A5F" />
    <title>نظام سين | Seen System</title>
  </head>
  <body class="min-h-screen overflow-x-hidden antialiased flex flex-col w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build (main app)
        run: npm run build

      - name: Build (customer app)
        run: npm run build:customer

  e2e:
    runs-on: ubuntu-latest
    # e2e/order-tracking-notifications.spec.ts mocks every backend call via
    # page.route() and defaults to the real staging origin
    # (playwright.config.ts) -- no live data is touched and no staff login
    # is needed, so this can run unconditionally on every push/PR instead of
    # depending on a secret that may never get configured.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

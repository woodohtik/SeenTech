name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # seen-deep-technical-audit.md Medium #6: no dependency-security check
      # existed at all. Report-only for now (continue-on-error) -- the
      # current dependency tree already has 42 known advisories (3
      # critical) that predate this step, so gating the build on them today
      # would fail every push/PR immediately. This surfaces the data (shows
      # as a non-blocking warning in the Actions UI) without blocking
      # anyone; tightening it into a real gate is a separate decision once
      # those existing findings have been triaged.
      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build (main app)
        run: npm run build

      - name: Build (customer app)
        run: npm run build:customer

  e2e:
    runs-on: ubuntu-latest
    # e2e/order-tracking-notifications.spec.ts mocks every backend call via
    # page.route() and defaults to the real staging origin
    # (playwright.config.ts) -- no live data is touched and no staff login
    # is needed, so this can run unconditionally on every push/PR instead of
    # depending on a secret that may never get configured.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

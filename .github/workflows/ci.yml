name: CI

on:
  push:
    # ci/** : a branch to run CI on without deploying (Vercel builds only main and staging).
    branches: [staging, main, 'ci/**']
  pull_request:
    branches: [staging, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc, then ESLint: an error fails the build, and so does going over
      # the warning ceiling in package.json's lint script (P6, CODEHEALTH-12:
      # 471 today -- lower it as warnings are fixed, never raise it).
      - name: Type check and lint
        run: npm run lint

      # seen-deep-technical-audit.md Medium #6: no dependency-security check
      # existed at all. Report-only for now (continue-on-error) --
      # مراجعة-الفريق-التقني-الكامل-2026-10-19.md triaged the original 42
      # advisories (3 critical): `npm audit fix` closed proxy-addr (express,
      # actually reachable -- feeds req.ip/trust-proxy used by the rate
      # limiter) and websocket-driver (firebase's realtime-db transitive
      # dep) with no breaking changes. 20 remain (1 critical): a `tar`
      # advisory reachable only through @capacitor/assets's CLI icon/splash
      # generator -- a local dev-only tool a developer runs manually on
      # files they supply themselves, never deployed, never reachable by
      # any real user -- whose only fix is a semver-major @capacitor/cli
      # bump that needs a real Android/iOS build-pipeline test this CI
      # can't do. Deliberately left ungated rather than force a major
      # mobile-tooling bump blind.
      # seen-readiness-fixes-task.md P6 (CODEHEALTH-10): a real gate on what
      # ships -- a critical advisory in a production dependency fails the
      # build. (The one known critical is in a dev-only tool, see above, and
      # is outside this gate; the full report below stays for visibility.)
      - name: Dependency audit (production dependencies, critical = fail)
        run: npm audit --omit=dev --audit-level=critical

      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build (main app)
        run: npm run build

      # Startup JS <= 250KB gzip, no vendor-firebase at startup, core language
      # file <= 40KB (seen-performance-first-open-login-task.md Phase 2.5).
      - name: Startup JS budget
        run: npm run size

      - name: Build (customer app)
        run: npm run build:customer
        # P4 (OPERATIONS-15): the build needs the site the app calls; a CI check build uses staging.
        env:
          VITE_CUSTOMER_API_ORIGIN: https://staging.seentech.io

  e2e:
    runs-on: ubuntu-latest
    # e2e/order-tracking-notifications.spec.ts mocks every backend call via
    # page.route() and defaults to the real staging origin
    # (playwright.config.ts) -- no live data is touched and no staff login
    # is needed, so this can run unconditionally on every push/PR instead of
    # depending on a secret that may never get configured.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # seen-stability-guardrails-task.md phase 1: the golden paths -- the day's
  # real work end to end, against the app built on a LOCAL Supabase (never
  # staging or production) with "محل الاختبار الآلي" seeded from nothing.
  # Each path checks the database, not only the screen. Failures arrive as
  # annotations, with screenshots and the server log as artifacts.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start the local Supabase (database, auth, API)
        run: supabase start -x studio,imgproxy

      - name: Its address and keys (local, throw-away)
        run: |
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)=' /tmp/supabase.env | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Build the app against it
        run: VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: Seed the test shop
        run: |
          GOLDEN_DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -1)"           GOLDEN_SUPABASE_URL="$API_URL" GOLDEN_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx tsx e2e/golden/seed.ts

      - name: Start the server
        run: |
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_JWT_SECRET="$JWT_SECRET"             NODE_ENV=production nohup node server-build/server.cjs > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/ping > /dev/null && exit 0; sleep 1; done
          echo "::error::the server did not start"; tail -50 server.log; exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Golden paths
        env:
          GOLDEN_SUPABASE_URL: ${{ env.API_URL }}
          GOLDEN_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx playwright test -c playwright.golden.config.ts

      # A map of the screens the next paths walk through (temporary, while the paths are written).
      - name: Probe the next screens
        if: always()
        env:
          GOLDEN_PROBE: '1'
          GOLDEN_SUPABASE_URL: ${{ env.API_URL }}
          GOLDEN_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx playwright test -c playwright.golden.config.ts zz-probe || true

      # seen-merchant-trial-test-2026-11-26.md, phase 4: the design table's screens
      # at 400/820/1280/1700, of the test shop (temporary, for the before/after).
      - name: Screens of the design table
        if: always()
        env:
          GOLDEN_SCREENS: '1'
          GOLDEN_SCREENS_LABEL: ${{ github.sha }}
          GOLDEN_SUPABASE_URL: ${{ env.API_URL }}
          GOLDEN_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx playwright test -c playwright.golden.config.ts zz-screens || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-screens
          path: golden-screens/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-probe
          path: golden-probe/
          retention-days: 3

      - name: Server log on failure
        if: failure()
        run: |
          tail -100 server.log | sed 's/^/::warning::server: /' || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-report
          path: |
            playwright-golden-report/
            test-results/
            server.log
          retention-days: 14

  # seen-cto-sprint4-design-quality-task.md item 4 (CTO review section
  # 6/9): zero pgTAP coverage existed for any RLS policy or financial
  # RPC -- the role-gating fixed in 20261121000000/20261122000000 (sprint
  # 4 items 1/2, already in production) had no automated test proving it
  # stays correct as later migrations touch the same tables. `supabase
  # test db` spins up a full local Postgres from every migration in
  # supabase/migrations/ (ubuntu-latest ships Docker already, no local
  # setup needed) and runs every supabase/tests/*.sql file against it.
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version: latest makes this action call GitHub's release API to
      # resolve it -- hit that API's rate limit on an earlier run of this
      # exact job ("Failed to resolve latest Supabase CLI release: rate
      # limit exceeded"), unrelated to pgTAP itself. Pinned to a specific
      # version (confirmed working locally via `npx supabase --version`)
      # to skip that lookup entirely -- not tied to any package.json
      # devDependency, this project doesn't pin the CLI there.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # `supabase test db` only connects to an already-running local
      # stack -- it doesn't start one itself (confirmed by this exact job
      # failing with ECONNREFUSED on 127.0.0.1:54322 the first time this
      # was wired up without this step). `db start` (Postgres only, not
      # the full `start` stack with gotrue/storage/etc, none of which
      # pgTAP needs) applies every migration in supabase/migrations/ to
      # a fresh local Postgres before the tests run against it.
      - name: Start local Postgres
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      # seen-stability-guardrails-task.md phase 3: the functions the migrations
      # build must match the committed snapshot (supabase/schema/functions/).
      # A change to a function without updating the snapshot -- or a function
      # rebuilt from an old migration's copy, losing a later fix -- fails here,
      # with an annotation on each differing file.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (for the snapshot script)
        run: npm ci

      - name: Database functions match the snapshot
        env:
          SUPABASE_CLI: supabase
        run: npx tsx scripts/db/snapshot-functions.ts --local --check

  # مراجعة-الفريق-التقني-الكامل-2026-10-19.md (ديف أوبس): لا توجد خطوة CI
  # تبني capacitor-customer/android (تطبيق العملاء، Google Play) قبل أي
  # دمج -- كسر توافق Capacitor/Gradle كان لا يُكتشَف إلا عند محاولة بناء
  # يدوي فعلي، وتحديداً وقت رفعة حقيقية على Play Console. هذا فحص تجميع
  # (assembleDebug) فقط، بلا توقيع ولا نشر -- continue-on-error لأنها أول
  # مرة يعمل فيها Gradle في CI هذا المشروع، تُشدَّد لبوابة حقيقية لاحقاً
  # بعد إثبات استقرارها.
  android-build-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build customer app web assets
        run: npm run build:customer
        env:
          VITE_CUSTOMER_API_ORIGIN: https://staging.seentech.io

      - name: Sync Capacitor Android project
        working-directory: capacitor-customer
        run: npx cap sync android

      - name: Gradle assembleDebug (compile check only, no signing)
        working-directory: capacitor-customer/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # seen-deep-technical-audit.md Medium #6: no dependency-security check
      # existed at all. Report-only for now (continue-on-error) --
      # مراجعة-الفريق-التقني-الكامل-2026-10-19.md triaged the original 42
      # advisories (3 critical): `npm audit fix` closed proxy-addr (express,
      # actually reachable -- feeds req.ip/trust-proxy used by the rate
      # limiter) and websocket-driver (firebase's realtime-db transitive
      # dep) with no breaking changes. 20 remain (1 critical): a `tar`
      # advisory reachable only through @capacitor/assets's CLI icon/splash
      # generator -- a local dev-only tool a developer runs manually on
      # files they supply themselves, never deployed, never reachable by
      # any real user -- whose only fix is a semver-major @capacitor/cli
      # bump that needs a real Android/iOS build-pipeline test this CI
      # can't do. Deliberately left ungated rather than force a major
      # mobile-tooling bump blind.
      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build (main app)
        run: npm run build

      - name: Build (customer app)
        run: npm run build:customer

  e2e:
    runs-on: ubuntu-latest
    # e2e/order-tracking-notifications.spec.ts mocks every backend call via
    # page.route() and defaults to the real staging origin
    # (playwright.config.ts) -- no live data is touched and no staff login
    # is needed, so this can run unconditionally on every push/PR instead of
    # depending on a secret that may never get configured.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # مراجعة-الفريق-التقني-الكامل-2026-10-19.md (ديف أوبس): لا توجد خطوة CI
  # تبني capacitor-customer/android (تطبيق العملاء، Google Play) قبل أي
  # دمج -- كسر توافق Capacitor/Gradle كان لا يُكتشَف إلا عند محاولة بناء
  # يدوي فعلي، وتحديداً وقت رفعة حقيقية على Play Console. هذا فحص تجميع
  # (assembleDebug) فقط، بلا توقيع ولا نشر -- continue-on-error لأنها أول
  # مرة يعمل فيها Gradle في CI هذا المشروع، تُشدَّد لبوابة حقيقية لاحقاً
  # بعد إثبات استقرارها.
  android-build-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build customer app web assets
        run: npm run build:customer

      - name: Sync Capacitor Android project
        working-directory: capacitor-customer
        run: npx cap sync android

      - name: Gradle assembleDebug (compile check only, no signing)
        working-directory: capacitor-customer/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
